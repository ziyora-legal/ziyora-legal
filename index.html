<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIYORA Legal Center</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --accent-blue: #2563eb;
            --accent-blue-hover: #1d4ed8;
            --accent-blue-light: #eff6ff;
            --border-color: #e2e8f0;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --card-shadow-hover: 0 20px 25px -5px rgba(37, 99, 235, 0.1), 0 8px 10px -6px rgba(37, 99, 235, 0.1);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }

        /* Container */
        .container {
            width: 100%;
            max-width: 800px;
            padding: 0 1.5rem;
            margin: auto 0;
            text-align: center;
        }

        /* Header */
        header {
            margin-bottom: 3.5rem;
        }

        .brand-badge {
            display: inline-block;
            width: 48px;
            height: 48px;
            background-color: var(--accent-blue-light);
            color: var(--accent-blue);
            border-radius: 12px;
            line-height: 48px;
            font-weight: 700;
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: Clamp(2rem, 5vw, 2.75rem);
            font-weight: 800;
            letter-spacing: -0.025em;
            color: var(--text-main);
            margin-bottom: 0.75rem;
        }

        .subtitle {
            font-size: 1.125rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Nav Cards Grid */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            justify-content: center;
            width: 100%;
        }

        /* Card Link Styling */
        .card-button {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.25rem 1.5rem;
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: var(--card-shadow);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .card-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background-color: var(--accent-blue);
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .card-button:hover {
            transform: translateY(-4px);
            border-color: rgba(37, 99, 235, 0.3);
            box-shadow: var(--card-shadow-hover);
        }

        .card-button:hover::before {
            opacity: 1;
        }

        .card-button:active {
            transform: translateY(-1px);
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background-color: var(--accent-blue-light);
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
            transition: transform 0.25s ease;
        }

        .card-button:hover .card-icon {
            transform: scale(1.08);
            background-color: var(--accent-blue);
            color: #ffffff;
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text-main);
        }

        .card-action {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--accent-blue);
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .card-action svg {
            transition: transform 0.25s ease;
        }

        .card-button:hover .card-action svg {
            transform: translateX(4px);
        }

        /* Footer */
        footer {
            width: 100%;
            padding: 2rem 1.5rem;
            text-align: center;
            border-top: 1px solid var(--border-color);
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* Accessibility focus states */
        .card-button:focus-visible {
            outline: 2px solid var(--accent-blue);
            outline-offset: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand-badge">Z</div>
            <h1>ZIYORA Legal Center</h1>
            <p class="subtitle">Official Legal Documents</p>
        </header>

        <main class="card-grid">
            <a href="privacy.html" class="card-button" aria-label="View Privacy Policy">
                <div class="card-icon" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </div>
                <span class="card-title">Privacy Policy</span>
                <span class="card-action">
                    Read Document
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </span>
            </a>

            <a href="terms.html" class="card-button" aria-label="View Terms of Service">
                <div class="card-icon" aria-hidden="true">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                </div>
                <span class="card-title">Terms of Service</span>
                <span class="card-action">
                    Read Document
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </span>
            </a>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 ZIYORA. All rights reserved.</p>
    </footer>

</body>
</html>
